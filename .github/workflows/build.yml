name: Build FastDl

on:
  workflow_dispatch:        # permite rodar manualmente pelo botão "Run workflow"
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar (exe único, sem precisar instalar o .NET)
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter FastDl.csproj | Select-Object -First 1
          dotnet publish $proj.FullName -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: FastDl-win-x64
          path: publish/
